name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: dist/ matches src/
        run: git diff --exit-code -- dist/sakuga.js dist/sakuga.core.js dist/sakuga.iife.js || (echo "dist/ is stale: run npm run build and commit dist/" && exit 1)
      - name: package contents
        run: npm pack --dry-run
